services:
  # ---------- Backend ----------
  backend:
    build: ./koparide-backend
    container_name: koparide-backend
    ports:
      - "5000:5000"
    env_file:
      - ./koparide-backend/.env
    environment:
      # Override any variable that needs Docker-specific value
      - NODE_ENV=production
      - DATABASE_URL=
    depends_on:
      - db
    restart: unless-stopped

  # ---------- Frontend ----------
  frontend:
   build:
     context: ./koparide-frontend
     args:
       # These will be read from the .env file in the same directory
       VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
       VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
       VITE_API_URL: ${VITE_API_URL}
   container_name: koparide-frontend
   ports:
     - "80:80"
   restart: unless-stopped
   depends_on:
     - backend

  # ---------- Database ----------
  db:
    image: postgres:15-alpine
    container_name: koparide-db
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: